<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memorama Filosófico</title>
<style>
:root{--bg:#0b1222;--bg2:#13203d;--gold:#d4af37;--gold2:#f3dc8a;--parch:#f1e4c3;--parch2:#d9c595;--ink:#2a1f10;--ok:#3fb36b;--bad:#c0495a;--text:#f1e4c3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,var(--bg2),var(--bg) 70%) fixed;color:var(--text);font-family:Georgia,"Times New Roman",serif}
h1,h2,h3{font-family:"Palatino Linotype",Palatino,Georgia,serif;margin:0;color:var(--gold2);letter-spacing:.04em}
.hidden{display:none!important}
.screen{max-width:1000px;margin:0 auto;padding:16px}
button{font:inherit;cursor:pointer}
.btn{background:linear-gradient(#e6c65a,#b8902a);color:#2a1f10;border:0;border-radius:12px;padding:10px 18px;font-weight:700;box-shadow:0 3px 0 #7a5d15}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5d15}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--gold);box-shadow:none}
.btn.big{font-size:1.5rem;padding:16px 36px;border-radius:16px}
/* ---------- Configuración ---------- */
.panel{background:linear-gradient(160deg,rgba(241,228,195,.08),rgba(241,228,195,.03));border:1px solid rgba(212,175,55,.45);border-radius:18px;padding:20px;margin-top:14px}
.title{text-align:center;padding:18px 0 4px}
.title h1{font-size:clamp(1.8rem,6vw,3rem)}
.title p{margin:6px 0 0;opacity:.8;font-style:italic}
.row{margin:14px 0}
.row label.l{display:block;margin-bottom:6px;color:var(--gold2);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1;min-width:70px;background:rgba(0,0,0,.3);color:var(--text);border:1px solid rgba(212,175,55,.4);border-radius:10px;padding:10px}
.seg button.on{background:var(--gold);color:#2a1f10;font-weight:700}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.names input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--gold);background:var(--parch);color:var(--ink);font:inherit}
.toggles{display:flex;gap:18px;flex-wrap:wrap}
.toggles label{display:flex;gap:8px;align-items:center}
.info{font-size:.9rem;opacity:.8;margin-top:6px}
/* ---------- Juego ---------- */
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.players{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:12px;border:1px solid rgba(212,175,55,.4);background:rgba(0,0,0,.35);min-width:92px;text-align:center;transition:.2s}
.chip b{display:block;font-size:1.3rem;color:var(--gold2)}
.chip.active{background:var(--gold);color:#2a1f10;transform:scale(1.07);box-shadow:0 0 16px rgba(212,175,55,.7)}
.chip.active b{color:#2a1f10}
.status{text-align:center;margin:6px 0}
.status .turn{font-size:1.2rem;color:var(--gold2)}
.timer{height:12px;border-radius:8px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(212,175,55,.4)}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.timer.low i{background:var(--bad)}
.meta{display:flex;justify-content:space-between;font-size:.95rem;margin:4px 0 10px;opacity:.9}
.board{display:grid;gap:clamp(4px,1.2vw,12px);grid-template-columns:repeat(var(--cols),1fr);margin:0 auto;max-width:var(--maxw,720px)}
.card{perspective:800px;border:0;background:none;padding:0;aspect-ratio:3/4;width:100%}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.card.open .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.back{background:repeating-linear-gradient(45deg,#15264a 0 8px,#1a2f5c 8px 16px);border:2px solid var(--gold);box-shadow:inset 0 0 0 4px #0b1222,inset 0 0 0 5px var(--gold)}
.back span{font-size:clamp(1.4rem,6vw,2.8rem);color:var(--gold2);text-shadow:0 0 10px rgba(212,175,55,.6)}
.front{transform:rotateY(180deg);background:linear-gradient(#f6ebcd,var(--parch2));border:2px solid var(--gold);color:var(--ink);padding:6%;gap:6%}
.pic{position:relative;width:72%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid #8a6a1c;background:#222;flex:none}
.pic svg,.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pic img{opacity:0;transition:opacity .3s}
.pic img.ok{opacity:1}
.nm{font-weight:700;font-size:clamp(.5rem,1.9vw,.95rem);text-align:center;line-height:1.1}
.card.matched .front{animation:glow 1s ease-out;box-shadow:0 0 0 3px var(--ok),0 0 18px var(--gold)}
.card.wrong .inner{animation:shake .45s}
.card.wrong .front{background:linear-gradient(#f3d3d6,#dba7ad)}
@keyframes glow{0%{filter:brightness(1.8)}100%{filter:brightness(1)}}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0)}20%,60%{transform:rotateY(180deg) translateX(-8px)}40%,80%{transform:rotateY(180deg) translateX(8px)}}
/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,8,18,.88);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px;text-align:center}
.overlay .box{max-width:560px;width:100%}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:20px 0}
.pod{width:90px;border-radius:10px 10px 0 0;background:linear-gradient(var(--gold2),#9a7620);color:#2a1f10;padding:6px 4px;font-weight:700}
.pod small{display:block;font-weight:400}
.pod.p1{height:150px}.pod.p2{height:110px}.pod.p3{height:80px}.pod.p4{height:60px}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:30;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
@media (prefers-reduced-motion:reduce){.inner{transition:none}}

/* ---------- EFECTOS Y ANIMACIONES ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.screen{position:relative;z-index:1}
.title h1{background:linear-gradient(90deg,#b8902a,#fff3c0,#d4af37,#fff3c0,#b8902a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite;filter:drop-shadow(0 0 12px rgba(212,175,55,.45))}
.panel{animation:rise2 .8s cubic-bezier(.2,.9,.3,1) both}
.seg button{transition:.2s}.seg button:hover{transform:translateY(-2px);box-shadow:0 0 12px rgba(212,175,55,.5)}
.btn{transition:filter .2s}.btn:hover{filter:brightness(1.12)}
.btn.big{animation:btnpulse 2.2s infinite}
.chip.active{animation:chipPulse 1.4s infinite}
.chip.bump b{animation:bump .7s}
.timer.low{animation:tpulse .5s infinite}
.timer.low + .meta span:first-child{color:#ff8a8a;font-weight:700;animation:tpulse .5s infinite}
.timer i{transition:width .1s linear}
.card{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s,filter .2s}
.card:hover:not(.open):not(.matched){transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.06);filter:drop-shadow(0 0 10px rgba(212,175,55,.7))}
.card.open,.card.matched{transform:none}
.card.deal{animation:deal .6s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:var(--d,0ms)}
.card.open{animation:lift .5s;position:relative;z-index:2}
.card.matched{animation:pop .8s}
.card.wrong{animation:redflash .7s}
.back span{animation:floaty 3s ease-in-out infinite}
.overlay{animation:fadein .4s;overflow:hidden}
.overlay .box{position:relative;z-index:1;animation:zoomin .55s cubic-bezier(.2,1.3,.4,1)}
.rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(rgba(212,175,55,.2) 0 8deg,transparent 8deg 20deg);animation:spin 40s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 50%);mask-image:radial-gradient(circle,#000 0,transparent 50%)}
.pod{position:relative;transform-origin:bottom;animation:rise .8s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--pd,0s)}
.pod.top{box-shadow:0 0 30px rgba(243,220,138,.9)}
.crown{position:absolute;left:50%;top:-40px;font-size:2rem;animation:crownbob 1.6s ease-in-out infinite}
.banner{position:fixed;left:50%;top:42%;z-index:15;pointer-events:none;opacity:0;white-space:nowrap;font-family:"Palatino Linotype",Georgia,serif;font-size:clamp(1.6rem,7vw,3.4rem);font-weight:700;color:var(--gold2);text-shadow:0 0 18px rgba(212,175,55,.9),0 3px 0 #5a430c;transform:translate(-50%,-50%)}
.banner.show{animation:banner 1.2s ease-out}
.spark{position:fixed;width:9px;height:9px;margin:-4px;border-radius:50%;pointer-events:none;z-index:25;background:radial-gradient(#fff,#f3dc8a 40%,transparent 70%);animation:spark .9s ease-out forwards}
.ring{position:fixed;width:30px;height:30px;margin:-15px;border-radius:50%;border:3px solid var(--gold2);pointer-events:none;z-index:25;animation:ring .7s ease-out forwards}
.float{position:fixed;z-index:26;pointer-events:none;font-weight:700;font-size:1.6rem;color:var(--gold2);text-shadow:0 0 10px #000;transform:translateX(-50%);animation:floatup 1.1s ease-out forwards}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes rise2{from{opacity:0;transform:translateY(24px)}}
@keyframes btnpulse{0%,100%{box-shadow:0 3px 0 #7a5d15,0 0 0 rgba(212,175,55,.6)}50%{box-shadow:0 3px 0 #7a5d15,0 0 26px rgba(212,175,55,.9)}}
@keyframes chipPulse{0%,100%{box-shadow:0 0 10px rgba(212,175,55,.5)}50%{box-shadow:0 0 26px rgba(243,220,138,1)}}
@keyframes bump{40%{transform:scale(1.9);color:#fff}}
@keyframes tpulse{50%{opacity:.55}}
@keyframes deal{from{opacity:0;transform:translateY(-140px) rotate(-14deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes lift{50%{transform:scale(1.12) translateY(-8px);filter:drop-shadow(0 12px 14px rgba(0,0,0,.6))}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.18);filter:drop-shadow(0 0 22px #f3dc8a) brightness(1.3)}100%{transform:scale(1)}}
@keyframes redflash{0%,100%{filter:none}30%{filter:drop-shadow(0 0 16px rgba(255,60,80,.95))}}
@keyframes floaty{50%{transform:translateY(-5px) scale(1.08)}}
@keyframes fadein{from{opacity:0}}
@keyframes zoomin{from{opacity:0;transform:scale(.6)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{transform:scaleY(0);opacity:0}}
@keyframes crownbob{0%,100%{transform:translate(-50%,0) rotate(-8deg)}50%{transform:translate(-50%,-8px) rotate(8deg)}}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1.1)}}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@keyframes ring{to{transform:scale(5);opacity:0}}
@keyframes floatup{to{transform:translate(-50%,-70px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
/* Número de cada ficha (para jugar sin tocar la pantalla) */
.back .num{margin-top:4%;min-width:1.9em;line-height:1.9em;text-align:center;border-radius:50%;border:2px solid var(--gold);background:rgba(0,0,0,.45);color:#fff3c0;font-family:"Palatino Linotype",Georgia,serif;font-size:clamp(.9rem,3.8vw,2rem);text-shadow:0 0 8px rgba(212,175,55,.8)}
.cnum{position:absolute;top:3px;left:6px;font-style:normal;font-weight:700;font-size:clamp(.55rem,1.8vw,.9rem);color:#7a5d15}
.picker{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:6px 0 12px}
.picker label{color:var(--gold2);font-weight:700;font-size:1.1rem}
.picker input{width:90px;padding:10px;border-radius:10px;border:2px solid var(--gold);background:var(--parch);color:var(--ink);font:inherit;font-size:1.3rem;text-align:center}
#pickMsg{flex-basis:100%;text-align:center;min-height:1.2em;color:#ff9aa6;font-size:.95rem}
</style>
</head>
<body>
<canvas id="bg"></canvas><div id="banner" class="banner"></div>

<!-- ============ PANTALLA DE CONFIGURACIÓN ============ -->
<div id="setup" class="screen">
  <div class="title"><h1>🏛️ Memorama Filosófico</h1><p>Encuentra las parejas de grandes pensadores</p></div>
  <div class="panel">
    <div class="row"><label class="l">Jugadores</label><div class="seg" data-key="players"></div></div>
    <div class="row"><label class="l">Nombres</label><div class="names" id="names"></div></div>
    <div class="row"><label class="l">Tamaño del tablero</label><div class="seg" data-key="size"></div></div>
    <div class="row"><label class="l">Dificultad</label><div class="seg" data-key="diff"></div></div>
    <div class="row"><label class="l">Tiempo máximo por turno</label><div class="seg" data-key="time"></div>
      <div class="info" id="timeInfo"></div></div>
    <div class="row toggles">
      <label><input type="checkbox" id="optMusic" checked> Música de fondo</label>
      <label><input type="checkbox" id="optSfx" checked> Efectos de sonido</label>
    </div>
    <div style="text-align:center;margin-top:18px"><button class="btn big" id="startBtn">Comenzar</button></div>
  </div>
</div>

<!-- ============ PANTALLA DE JUEGO ============ -->
<div id="game" class="screen hidden">
  <div class="hud">
    <div class="players" id="players"></div>
    <div><button class="btn ghost" id="pauseBtn">⏸ Pausa</button> <button class="btn ghost" id="restartBtn">↺ Reiniciar</button></div>
  </div>
  <div class="status"><div class="turn" id="turnTxt"></div></div>
  <div class="timer" id="timerBar"><i id="timerFill"></i></div>
  <div class="meta"><span id="timerTxt"></span><span id="pairsTxt"></span></div>
  <div class="picker"><label for="pickNum">Ficha n.º</label><input id="pickNum" type="number" inputmode="numeric" min="1" autocomplete="off"><button class="btn" id="pickBtn">Voltear</button><span id="pickMsg"></span></div>
  <div class="board" id="board"></div>
</div>

<div id="pauseOv" class="overlay hidden"><div class="box"><h2>⏸ Partida en pausa</h2><p><button class="btn big" id="resumeBtn">Continuar</button></p></div></div>

<div id="winOv" class="overlay hidden"><div class="rays"></div><div class="box">
  <h2 id="winTitle"></h2><div class="podium" id="podium"></div>
  <button class="btn big" id="againBtn">Jugar otra vez</button>
  <p><button class="btn ghost" id="menuBtn">Cambiar configuración</button></p>
</div></div>

/* Ajustes de juego */
const SIZES = {"4x4":{cols:4,rows:4,f:1}, "5x4":{cols:5,rows:4,f:0.9}, "6x6":{cols:6,rows:6,f:0.8}}; // f = factor de tiempo
const DIFFS = {facil:{label:"Fácil",f:1}, normal:{label:"Normal",f:0.8}, dificil:{label:"Difícil",f:0.6}};
const TIMES = [10,15,20];
const MISMATCH_MS = 1000;  // tiempo que se ven las fichas que no coinciden
const WARN_SECS = 3;       // cuenta regresiva en los últimos segundos

/* Audio reemplazable: pon la ruta de un archivo (mp3/ogg) para sustituir el sonido sintetizado.
   Ejemplo: flip:"sonidos/voltear.mp3"   (dejar "" usa el sonido generado por código) */
const AUDIO_FILES = {music:"", flip:"", match:"", fail:"", turn:"", tick:"", win:"", ui:""};

/* ---------- 2) SONIDO ---------- */
const Sound = (() => {
  let ctx, musicOn = true, sfxOn = true, mTimer = null, step = 0, musicEl = null, master;
  const init = () => { if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = .8; master.connect(ctx.destination);}catch(e){} } if(ctx && ctx.state==="suspended") ctx.resume(); };
  const tone = (f, d, type="sine", v=.15, at=0, dest) => {
    if(!ctx) return; const t = ctx.currentTime+at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(v,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(dest||master); o.start(t); o.stop(t+d+.05);
  };
  const file = (k) => { if(!AUDIO_FILES[k]) return false; const a = new Audio(AUDIO_FILES[k]); a.play().catch(()=>{}); return true; };
  const sfx = {
    flip: () => { tone(420,.08,"triangle",.12); tone(620,.06,"triangle",.08,.03); },
    match:() => [523,659,784,1047].forEach((f,i)=>tone(f,.3,"sine",.14,i*.09)),
    fail: () => { tone(220,.25,"sawtooth",.09); tone(165,.35,"sawtooth",.09,.12); },
    turn: () => { tone(392,.15,"sine",.1); tone(523,.2,"sine",.1,.12); },
    tick: () => tone(880,.07,"square",.06),
    win:  () => [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.35,"triangle",.14,i*.15)),
    ui:   () => tone(500,.06,"sine",.08)
  };
  const play = (k) => { if(!sfxOn) return; init(); if(file(k)) return; sfx[k] && sfx[k](); };
  // Música generativa suave (acordes Dm - Bb - F - C con arpegio)
  const CH = [[146.8,220,293.7,349.2],[116.5,233,293.7,349.2],[174.6,261.6,349.2,440],[130.8,261.6,329.6,392]];
  const startMusic = () => {
    if(!musicOn) return; init();
    if(AUDIO_FILES.music){ if(!musicEl){ musicEl = new Audio(AUDIO_FILES.music); musicEl.loop = true; musicEl.volume=.4; } musicEl.play().catch(()=>{}); return; }
    if(mTimer || !ctx) return;
    const lp = ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1200; lp.connect(master);
    mTimer = setInterval(()=>{
      const chord = CH[Math.floor(step/8)%4], n = chord[step%4];
      if(step%8===0) chord.slice(0,3).forEach(f=>tone(f/2,4,"sine",.05,0,lp));
      tone(n*(step%8>3?2:1),1.2,"triangle",.045,0,lp); step++;
    },500);
  };
  const stopMusic = () => { clearInterval(mTimer); mTimer=null; if(musicEl) musicEl.pause(); };
  return { init, play, startMusic, stopMusic,
    setMusic(v){ musicOn=v; v?startMusic():stopMusic(); }, setSfx(v){ sfxOn=v; } };
})();

/* ---------- 3) ESTADO Y REGLAS ---------- */
const $ = (id) => document.getElementById(id);
const cfg = {players:2, size:"4x4", diff:"normal", time:15, names:["Jugador 1","Jugador 2","Jugador 3","Jugador 4"]};
let G = null; // estado de la partida

const shuffle = (a) => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
// Tiempo real por turno: base × dificultad × tamaño (mínimo 5 s)
const turnTime = () => Math.max(5, Math.round(cfg.time * DIFFS[cfg.diff].f * SIZES[cfg.size].f));

function newGame(){
  const s = SIZES[cfg.size], pairs = s.cols*s.rows/2;
  const deck = shuffle(PHILOSOPHERS).slice(0,pairs);
  const cards = shuffle(deck.concat(deck).map((p,i)=>({p, id:p.name})));
  G = { cards, open:[], locked:false, paused:false, ended:false, cur:0, left:pairs, total:pairs,
        scores:Array(cfg.players).fill(0), max:turnTime(), t:turnTime(), lastTick:null };
  buildBoard(); renderHud(); startTimer(); Sound.play("turn"); banner("¡Comienza "+cfg.names[0]+"!");
}

function flip(i, el){
  if(!G || G.locked || G.paused || G.ended) return;
  const c = G.cards[i];
  if(c.matched || G.open.includes(i)) return;   // ni emparejada ni la misma dos veces
  G.open.push(i); el.classList.add("open"); Sound.play("flip");
  if(G.open.length===2) resolve();
}

function resolve(){
  G.locked = true;
  const [a,b] = G.open, A = G.cards[a], B = G.cards[b], ea = tile(a), eb = tile(b);
  if(A.id===B.id){
    setTimeout(()=>{
      A.matched = B.matched = true; ea.classList.add("matched"); eb.classList.add("matched");
      G.scores[G.cur]++; G.left--; G.open=[]; Sound.play("match"); renderHud();
      G.streak=(G.streak||0)+1; burst(ea); burst(eb); floatText(ea,"+1 ✦"); if(G.streak>1 && G.left>0) banner("¡Racha x"+G.streak+"!");
      if(G.left===0) return finish();
      G.t = G.max; G.locked=false;           // acierta: repite turno
    },550);
  } else {
    setTimeout(()=>{ ea.classList.add("wrong"); eb.classList.add("wrong"); Sound.play("fail"); },450);
    setTimeout(()=>{ [ea,eb].forEach(e=>e.classList.remove("open","wrong")); G.open=[]; nextTurn(); }, 450+MISMATCH_MS);
  }
}

function nextTurn(){
  G.cur = (G.cur+1)%cfg.players; G.t = G.max; G.locked=false; G.lastTick=null; G.streak=0;
  renderHud(); Sound.play("turn"); banner("Turno de "+cfg.names[G.cur]);
}

let timerId = null;
function startTimer(){
  clearInterval(timerId);
  timerId = setInterval(()=>{
    if(!G || G.paused || G.ended || G.locked) return;
    G.t -= .1;
    const sec = Math.ceil(G.t);
    if(G.t<=WARN_SECS && G.t>0 && sec!==G.lastTick){ G.lastTick=sec; Sound.play("tick"); }
    if(G.t<=0){                              // se agotó el tiempo
      G.open.forEach(i=>tile(i).classList.remove("open")); G.open=[]; nextTurn();
    }
    renderTimer();
  },100);
}

function finish(){
  G.ended=true; clearInterval(timerId); renderHud();
  setTimeout(showWin, 600);
}

/* ---------- 4) INTERFAZ ---------- */
const tile = (i) => $("board").children[i];

function avatar(p){
  // Avatar ilustrado tipo busto clásico (se usa siempre debajo de la foto y como respaldo)
  return `<svg viewBox="0 0 100 100"><defs><radialGradient id="g${p.c.slice(1)}" cx=".5" cy=".3"><stop offset="0" stop-color="${p.c}" stop-opacity=".7"/><stop offset="1" stop-color="#0b1222"/></radialGradient></defs>
  <rect width="100" height="100" fill="url(#g${p.c.slice(1)})"/>
  <path d="M12 100 Q16 68 50 64 Q84 68 88 100Z" fill="#e9dcbc"/>
  <ellipse cx="50" cy="42" rx="19" ry="23" fill="#f3e6c8"/>
  <path d="M30 40 Q32 16 50 16 Q68 16 70 40 Q62 28 50 28 Q38 28 30 40Z" fill="#b9b2a0"/>
  <path d="M38 58 Q50 80 62 58 Q50 66 38 58Z" fill="#b9b2a0"/>
  <circle cx="43" cy="42" r="2" fill="#333"/><circle cx="57" cy="42" r="2" fill="#333"/></svg>`;
}

function buildBoard(){
  const s = SIZES[cfg.size], b = $("board");
  b.style.setProperty("--cols", s.cols);
  b.style.setProperty("--maxw", (s.cols*(cfg.size==="6x6"?110:130))+"px");
  b.innerHTML = "";
  G.cards.forEach((c,i)=>{
    const el = document.createElement("button");
    el.className="card deal"; el.style.setProperty("--d",(i*45)+"ms"); el.style.setProperty("--sd",(Math.random()*4).toFixed(2)+"s"); el.setAttribute("aria-label","Ficha");
    el.innerHTML = `<div class="inner"><div class="face back"><span>🏛</span><b class="num">${i+1}</b></div>
      <div class="face front"><i class="cnum">${i+1}</i><div class="pic">${avatar(c.p)}</div><div class="nm">${c.p.name}</div></div></div>`;
    if(c.p.img){                              // la foto aparece solo si carga bien
      const im = new Image(); im.alt = c.p.name; im.referrerPolicy="no-referrer";
      im.onload = ()=>im.classList.add("ok"); im.onerror = ()=>im.remove();
      im.src = c.p.img; el.querySelector(".pic").appendChild(im);
    }
    el.onclick = ()=>flip(i, el);
    el.addEventListener("animationend",e=>{ if(e.animationName==="deal") el.classList.remove("deal"); });
    el.addEventListener("pointermove",e=>{ if(e.pointerType!=="mouse"||el.classList.contains("open")||el.classList.contains("matched")) return;
      const r=el.getBoundingClientRect(); el.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*18+"deg"); el.style.setProperty("--rx",(.5-(e.clientY-r.top)/r.height)*18+"deg"); });
    el.addEventListener("pointerleave",()=>{ el.style.setProperty("--rx","0deg"); el.style.setProperty("--ry","0deg"); });
    b.appendChild(el);
  });
}

function renderHud(){
  $("players").innerHTML = G.scores.map((s,i)=>
    `<div class="chip ${i===G.cur&&!G.ended?"active":""}">${esc(cfg.names[i])}<b>${s}</b></div>`).join("");
  G.scores.forEach((s,i)=>{ if(G.prev && s>G.prev[i]) $("players").children[i].classList.add("bump"); }); G.prev=G.scores.slice();
  $("turnTxt").textContent = G.ended ? "Fin de la partida" : "Turno de "+cfg.names[G.cur];
  $("pairsTxt").textContent = "Parejas por encontrar: "+G.left;
  renderTimer();
}
function renderTimer(){
  const t = Math.max(0,G.t);
  $("timerFill").style.width = (t/G.max*100)+"%";
  $("timerTxt").textContent = "⏳ "+Math.ceil(t)+" s";
  $("timerBar").classList.toggle("low", t<=WARN_SECS);
}
const esc = (s) => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function show(id){ ["setup","game"].forEach(x=>$(x).classList.toggle("hidden",x!==id)); }

function showWin(){
  Sound.play("win");
  const order = cfg.names.slice(0,cfg.players).map((n,i)=>({n,s:G.scores[i]})).sort((a,b)=>b.s-a.s);
  const top = order.filter(o=>o.s===order[0].s);
  $("winTitle").textContent = top.length>1 ? "🤝 Empate" : "🏆 ¡Gana "+order[0].n+"!";
  const rank = order.length>=3 ? [1,0,2,3] : [1,0]; // podio: 2.º, 1.º, 3.º, 4.º
  $("podium").innerHTML = rank.filter(i=>order[i]).map(i=>
    `<div class="pod p${i+1} ${order[i].s===order[0].s?"top":""}" style="--pd:${(4-i)*.25}s">${order[i].s===order[0].s?'<span class="crown">👑</span>':""}${i+1}.º<br>${esc(order[i].n)}<small>${order[i].s} pares</small></div>`).join("");
  $("winOv").classList.remove("hidden"); confetti(); fireworks();
}
function confetti(){
  const cols=["#d4af37","#f3dc8a","#3fb36b","#6aa0ff","#f1e4c3"];
  for(let i=0;i<140;i++){ const d=document.createElement("i"); d.className="conf";
    d.style.left=Math.random()*100+"vw"; d.style.width=(6+Math.random()*8)+"px"; d.style.borderRadius=i%3?"2px":"50%"; d.style.background=cols[i%5];
    d.style.animationDuration=(2+Math.random()*2.5)+"s"; d.style.animationDelay=Math.random()*.8+"s";
    document.body.appendChild(d); setTimeout(()=>d.remove(),5500); }
}

/* ---------- EFECTOS VISUALES ---------- */
function burstAt(x,y,n=14,rainbow){
  const r=document.createElement("i"); r.className="ring"; r.style.left=x+"px"; r.style.top=y+"px"; document.body.appendChild(r); setTimeout(()=>r.remove(),800);
  for(let i=0;i<n;i++){ const s=document.createElement("i"), a=Math.PI*2*i/n+Math.random()*.4, d=40+Math.random()*70;
    s.className="spark"; s.style.left=x+"px"; s.style.top=y+"px";
    s.style.setProperty("--dx",Math.cos(a)*d+"px"); s.style.setProperty("--dy",Math.sin(a)*d+"px");
    if(rainbow) s.style.filter="hue-rotate("+Math.floor(Math.random()*360)+"deg)";
    document.body.appendChild(s); setTimeout(()=>s.remove(),1000); }
}
function burst(el){ const r=el.getBoundingClientRect(); burstAt(r.left+r.width/2, r.top+r.height/2, 14); }
function floatText(el,t){ const r=el.getBoundingClientRect(), f=document.createElement("div");
  f.className="float"; f.textContent=t; f.style.left=(r.left+r.width/2)+"px"; f.style.top=r.top+"px"; document.body.appendChild(f); setTimeout(()=>f.remove(),1200); }
function banner(t){ const b=$("banner"); b.textContent=t; b.classList.remove("show"); void b.offsetWidth; b.classList.add("show"); }
function fireworks(){ for(let k=0;k<7;k++) setTimeout(()=>burstAt(innerWidth*(.12+Math.random()*.76), innerHeight*(.12+Math.random()*.4), 28, true), k*450); }
// Polvo dorado flotando de fondo
(function(){ if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const cv=$("bg"), x=cv.getContext("2d"); let W,H; const P=[];
  const rs=()=>{ W=cv.width=innerWidth; H=cv.height=innerHeight; }; rs(); addEventListener("resize",rs);
  for(let i=0;i<55;i++) P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+.5,v:Math.random()*.4+.1,p:Math.random()*6.28});
  (function loop(){ x.clearRect(0,0,W,H); x.fillStyle="#f3dc8a";
    P.forEach(p=>{ p.y-=p.v; p.p+=.01; p.x+=Math.sin(p.p)*.3; if(p.y<-5){p.y=H+5;p.x=Math.random()*W;}
      x.globalAlpha=.3+.3*Math.sin(p.p*3); x.beginPath(); x.arc(p.x,p.y,p.r,0,6.28); x.fill(); });
    requestAnimationFrame(loop); })();
})();

/* ---------- 5) CONTROLES Y CONFIGURACIÓN ---------- */
const OPTIONS = {
  players:[[2,"2"],[3,"3"],[4,"4"]],
  size:Object.keys(SIZES).map(k=>[k,k]),
  diff:Object.entries(DIFFS).map(([k,v])=>[k,v.label]),
  time:TIMES.map(t=>[t,t+" s"])
};
function renderSetup(){
  document.querySelectorAll(".seg").forEach(seg=>{
    const key = seg.dataset.key;
    seg.innerHTML = OPTIONS[key].map(([v,l])=>`<button data-v="${v}" class="${String(cfg[key])===String(v)?"on":""}">${l}</button>`).join("");
    seg.onclick = (e)=>{ const b=e.target.closest("button"); if(!b) return;
      cfg[key] = typeof cfg[key]==="number" ? Number(b.dataset.v) : b.dataset.v;
      Sound.init(); Sound.play("ui"); renderSetup(); };
  });
  $("names").innerHTML = Array.from({length:cfg.players},(_,i)=>
    `<input maxlength="14" value="${esc(cfg.names[i])}" data-i="${i}" aria-label="Nombre del jugador ${i+1}">`).join("");
  $("names").oninput = (e)=>{ cfg.names[e.target.dataset.i] = e.target.value.trim()||"Jugador "+(+e.target.dataset.i+1); };
  $("timeInfo").textContent = "Tiempo real por turno con esta dificultad y tablero: "+turnTime()+" s (más difícil = menos tiempo).";
}

function start(){
  Sound.init(); Sound.play("ui");
  Sound.setMusic($("optMusic").checked); Sound.setSfx($("optSfx").checked);
  $("winOv").classList.add("hidden"); $("pauseOv").classList.add("hidden");
  show("game"); newGame(); $("pickMsg").textContent=""; $("pickNum").value=""; setTimeout(()=>$("pickNum").focus(),100);
}
function setPause(p){
  if(!G||G.ended) return; G.paused=p; $("pauseOv").classList.toggle("hidden",!p);
  $("pauseBtn").textContent = p?"▶ Seguir":"⏸ Pausa"; Sound.play("ui");
}
function toMenu(){
  if(G) G.ended=true; clearInterval(timerId); $("winOv").classList.add("hidden"); $("pauseOv").classList.add("hidden");
  renderSetup(); show("setup");
}

/* Voltear una ficha escribiendo su número (para partidas transmitidas, sin tocar la pantalla) */
function pick(){
  const inp = $("pickNum"), msg = $("pickMsg"), n = parseInt(inp.value,10);
  msg.textContent = "";
  if(!G || G.ended) return;
  if(!n || n<1 || n>G.cards.length){ msg.textContent = "Escribe un número del 1 al "+G.cards.length; inp.select(); return; }
  if(G.cards[n-1].matched || G.open.includes(n-1)){ msg.textContent = "La ficha "+n+" ya está volteada"; inp.select(); return; }
  if(G.locked || G.paused) return;
  flip(n-1, tile(n-1)); inp.value = ""; inp.focus();
}
$("pickBtn").onclick = pick;
$("pickNum").addEventListener("keydown", e=>{ if(e.key==="Enter") pick(); });
$("startBtn").onclick = start;
$("againBtn").onclick = start;
$("menuBtn").onclick = toMenu;
$("pauseBtn").onclick = ()=>setPause(!G.paused);
$("resumeBtn").onclick = ()=>setPause(false);
$("restartBtn").onclick = ()=>{ if(confirm("¿Reiniciar la partida?")) start(); };
$("optMusic").onchange = (e)=>{ Sound.init(); Sound.setMusic(e.target.checked); };
$("optSfx").onchange = (e)=>Sound.setSfx(e.target.checked);
renderSetup();
</script>
